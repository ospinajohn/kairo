[package]
name = "kairo-poc"
version = "0.1.0"
description = "Prueba de viabilidad Kairo — PV-001, PV-002, PV-006"
authors = ["you"]
edition = "2021"

[lib]
name = "kairo_poc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
