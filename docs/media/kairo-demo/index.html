<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kairo demo</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #09090a;
        --surface: #151518;
        --track: #363638;
        --text: #f5f5f4;
        --muted: #8e8e93;
        --accent: #ff4b2b;
        --hot: #ff7a3d;
        --gold: #ffb347;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      @font-face {
        font-family: 'Segoe UI Variable';
        src: local('Segoe UI Variable');
      }
      body {
        display: grid;
        place-items: center;
        background: #050506;
        font-family: 'Segoe UI Variable', 'Segoe UI', sans-serif;
      }

      #stage {
        position: relative;
        width: 960px;
        height: 540px;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 42%, rgba(255, 75, 43, 0.08), transparent 28%),
          radial-gradient(circle at 50% 100%, rgba(120, 25, 10, 0.22), transparent 58%), var(--bg);
      }

      .brand {
        position: absolute;
        top: 38px;
        left: 52px;
        color: var(--text);
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.24em;
        opacity: 0;
        animation: appear 0.7s ease-out 0.2s forwards;
      }

      .brand::after {
        content: 'FOCUS IN YOUR FLOW';
        display: block;
        margin-top: 7px;
        color: var(--muted);
        font-size: 9px;
        font-weight: 500;
        letter-spacing: 0.2em;
      }

      .timer {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 310px;
        height: 310px;
        transform: translate(-50%, -47%);
      }

      .timer::before,
      .timer::after {
        content: '';
        position: absolute;
        inset: 13px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 50%;
      }

      .timer::after {
        inset: 31px;
        border-color: rgba(255, 255, 255, 0.035);
      }

      .ring {
        position: absolute;
        inset: 48px;
        border: 10px solid var(--track);
        border-radius: 50%;
        transform: rotate(-90deg);
      }

      .ring::before {
        content: '';
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        border: 10px solid transparent;
        border-top-color: var(--accent);
        border-right-color: var(--hot);
        border-bottom-color: var(--gold);
        transform: rotate(0deg);
        clip-path: inset(0 0 0 50%);
        opacity: 0;
        filter: drop-shadow(0 0 12px rgba(255, 75, 43, 0.5));
        animation: progress 4s linear 1.2s forwards;
      }

      .time {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--text);
        font-size: 54px;
        font-weight: 300;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.03em;
      }

      .time::after {
        content: 'CONCENTRACIÓN';
        position: absolute;
        top: 63%;
        color: var(--muted);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.24em;
      }

      .state {
        position: absolute;
        right: 52px;
        bottom: 46px;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .state::before {
        content: '';
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 9px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 12px var(--accent);
        animation: state-dot 8s linear forwards;
      }

      .button {
        position: absolute;
        bottom: 38px;
        left: 50%;
        width: 116px;
        padding: 13px 0;
        border-radius: 999px;
        background: #3a3a3d;
        color: var(--text);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-align: center;
        transform: translateX(-50%);
        animation: button-state 8s linear forwards;
      }

      .compact {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 172px;
        height: 172px;
        display: grid;
        place-items: center;
        border: 1px solid #2b2b2f;
        border-radius: 38px;
        background: #000;
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.8);
        animation: compact-in 1.6s ease-out 6.2s forwards;
      }

      .compact::before {
        content: '25:00';
        color: var(--text);
        font-size: 27px;
        font-weight: 300;
        font-variant-numeric: tabular-nums;
      }

      .compact::after {
        content: 'MODO COMPACTO';
        position: absolute;
        bottom: 31px;
        color: var(--muted);
        font-size: 7px;
        letter-spacing: 0.18em;
      }

      @keyframes appear {
        to {
          opacity: 1;
        }
      }
      @keyframes progress {
        0% {
          opacity: 0;
          transform: rotate(0deg);
        }
        8% {
          opacity: 1;
        }
        100% {
          opacity: 1;
          transform: rotate(260deg);
        }
      }
      @keyframes state-dot {
        0%,
        52% {
          background: var(--accent);
        }
        54%,
        75% {
          background: var(--gold);
        }
        78%,
        100% {
          background: #54c7b5;
          box-shadow: 0 0 12px #54c7b5;
        }
      }
      @keyframes button-state {
        0%,
        45% {
          opacity: 1;
        }
        48%,
        74% {
          opacity: 0.6;
        }
        78%,
        100% {
          opacity: 0;
        }
      }
      @keyframes compact-in {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.8);
        }
        35%,
        100% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="kairo-demo"
      data-no-timeline
      data-start="0"
      data-duration="8"
      data-width="960"
      data-height="540"
      data-fps="30"
    >
      <div id="brand" class="brand clip" data-start="0" data-duration="8">KAIRO</div>
      <div id="timer" class="timer clip" data-start="0" data-duration="6.8">
        <div class="ring"></div>
        <div class="time">25:00</div>
      </div>
      <div id="primary-action" class="button clip" data-start="0" data-duration="6">INICIAR</div>
      <div id="session-state" class="state clip" data-start="0" data-duration="8">
        sesión activa
      </div>
      <div id="compact-mode" class="compact clip" data-start="6.1" data-duration="1.9"></div>
    </div>
  </body>
</html>
